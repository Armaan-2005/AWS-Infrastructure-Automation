image:
  name: hashicorp/terraform:latest
  entrypoint: [""]

stages:
  - backend
  - validate
  - plan
  - apply
  - destroy

before_script:
  - terraform -version

initializing backend:
  stage: backend
  script:
    - cd backend
    - terraform init
    - terraform apply --auto-approve -input=false

checking code:
  stage: validate
  script:
  - cd ..
  - terarform init
  - terraform fmt
  - terraform validate

planning code:
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 10 minutes

deploying code:
  stage: apply
  script:
    - terraform apply --auto-approve tfplan
  dependencies:
    - planning code

success:
  stage: apply
  script:
    - echo "automation successfull"
  when: on_success

failed:
  stage: apply
  script:
    - terraform destroy --auto-approve -input=false
    - echo "automation failed"
  when: on_failure

delete code:
  stage: destroy
  script:
    - terraform destroy --auto-approve -input=false
  when: manual

after_script:
  - echo "automation completed"